plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.dtho47.godot.apphud"
    compileSdk = 36
    buildToolsVersion = '35.0.0'

    defaultConfig {
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def libName = project.property("library_name")
    defaultConfig {
        buildConfigField "String", "LIBRARY_NAME", "\"$libName\""
    }

    libraryVariants.configureEach { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "$libName.${variant.name}.aar"
        }
    }

    buildFeatures {
        buildConfig true
    }
}

kotlin {
    jvmToolchain(17)
}

// Prefer the exact custom Godot engine AAR/JAR when it is present locally.
// CI and clean clones fall back to the official Godot 3.6.2 Android AAR from Maven Central.
// All Godot dependencies are compileOnly, so the Godot engine is never packaged into this plugin.
def publicGodotCoordinate = 'org.godotengine:godot:3.6.2.stable'
def releaseGodotLibraries = fileTree(dir: 'libs/release', include: ['godot-lib*.aar', 'godot-lib*.jar'])
def debugGodotLibraries = fileTree(dir: 'libs/debug', include: ['godot-lib*.aar', 'godot-lib*.jar'])

dependencies {
    implementation 'com.apphud:ApphudSDK-Android:3.4.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Keep the same Billing generation Apphud 3.4.2 is built against.
    implementation 'com.android.billingclient:billing-ktx:8.3.0'

    if (!releaseGodotLibraries.files.isEmpty()) {
        releaseCompileOnly releaseGodotLibraries
    } else {
        releaseCompileOnly publicGodotCoordinate
    }

    if (!debugGodotLibraries.files.isEmpty()) {
        debugCompileOnly debugGodotLibraries
    } else {
        debugCompileOnly publicGodotCoordinate
    }
}
