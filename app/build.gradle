plugins {
    id 'org.jetbrains.kotlin.android'
    id 'com.android.library'
    id 'kotlin-android'
}


android {

    namespace "com.dtho47.godot.apphud"
    compileSdk = 34
    buildToolsVersion = '34.0.0'


    defaultConfig {
        minSdk 26
        versionCode 1
        versionName "1.0.0"
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    def libName = project.property("library_name")

    defaultConfig{
        buildConfigField "String", "LIBRARY_NAME", "\"$libName\""
    }

    ndkVersion '23.2.8568313'

    libraryVariants.configureEach { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "$libName.${variant.name}.aar"
        }
    }

    buildFeatures {
        buildConfig true
    }

}


dependencies {
    implementation 'com.apphud:ApphudSDK-Android:2.7.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    
    implementation 'com.android.billingclient:billing-ktx:7.1.1'

    releaseCompileOnly fileTree(dir: 'libs/release', include: ['*.jar', '*.aar'])
    debugCompileOnly fileTree(dir: 'libs/debug', include: ['*.jar', '*.aar'])

}